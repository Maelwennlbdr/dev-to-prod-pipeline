name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 .

      - name: Run tests
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_SSLMODE: ${{ secrets.POSTGRES_SSLMODE }}
          POSTGRES_CHANNEL_BINDING: ${{ secrets.POSTGRES_CHANNEL_BINDING }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          pytest --maxfail=1 --disable-warnings -q

      - name: Build Docker image (validate)
        run: |
          docker build -t taskmanager:ci .

  deploy:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_SSLMODE: ${{ secrets.POSTGRES_SSLMODE }}
          POSTGRES_CHANNEL_BINDING: ${{ secrets.POSTGRES_CHANNEL_BINDING }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          docker build -t taskmanager:latest .

      - name: Push Docker image
        run: |
          docker tag taskmanager:latest ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager:latest
